<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Unusuale</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=25">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="index.html"><img class="wordmark-logo" src="assets/logo.png" alt="">Unusuale</a>
      <span class="wordmark-sub">A Wikipedia Game</span>
    </div>
  </header>

  <div class="page page-with-rail">
    <!-- The rail sits first in the source so that on narrow screens, where
         it collapses into a horizontal strip, it lands above the question
         instead of being stranded at the bottom of the page. On wide
         screens `order` moves it back to the right of the content. -->
    <aside class="card-rail" id="card-rail" hidden>
      <h2 class="card-rail-title">WikiCards</h2>
      <p class="card-rail-note"></p>
      <div class="card-controls">
        <button type="button" class="card-control" id="card-spread" aria-pressed="false">Spread</button>
        <button type="button" class="card-control" id="card-cycle">Cycle</button>
      </div>
      <ul class="card-list" id="card-list"></ul>
    </aside>

    <main class="content" id="content">
      <h1 class="page-title" id="puzzle-title">Today's Puzzle</h1>
      <div class="tagline" id="puzzle-date">Loading&hellip;</div>

      <div class="score-tracker" id="score-tracker">
        Score: <span id="score-value">0</span>
      </div>
      <span class="round-modifier" id="round-modifier" hidden></span>

      <div id="game"></div>
    </main>
  </div>

  <!-- Load order matters: game.js uses helpers from util.js and the
       handlers in question-types.js. -->
  <script src="util.js?v=2"></script>
  <script src="question-types.js?v=1"></script>
  <script src="game.js?v=22"></script>
  <script src="footer.js?v=1"></script>
</body>
</html>
